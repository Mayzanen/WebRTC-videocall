services:
  # Coturn TURN/STUN server for NAT traversal
  coturn:
    image: coturn/coturn:latest
    container_name: videortc-coturn
    command:
      - "--log-file=stdout"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "10000-10200:10000-10200/udp"
    volumes:
      - ./infrastructure/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    networks:
      default:
        ipv4_address: 172.18.0.10
    restart: unless-stopped

  # Janus WebRTC Gateway
  janus:
    build:
      context: .
      dockerfile: docker/janus.Dockerfile
    container_name: videortc-janus
    ports:
      - "8088:8088"
      - "8089:8089"
      - "8188:8188"
      - "20000-20200:20000-20200/udp"
    volumes:
      - ./infrastructure/janus/janus.jcfg:/opt/janus/etc/janus/janus.jcfg:ro
      - ./infrastructure/janus/janus.transport.websockets.jcfg:/opt/janus/etc/janus/janus.transport.websockets.jcfg:ro
      - ./infrastructure/janus/janus.plugin.videoroom.jcfg:/opt/janus/etc/janus/janus.plugin.videoroom.jcfg:ro
      - ./infrastructure/ssl:/opt/janus/certs:ro
    depends_on:
      - coturn
    restart: unless-stopped

  # NGINX reverse proxy
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: videortc-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/ssl:/etc/nginx/certs:ro
    depends_on:
      - janus
      - frontend
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: videortc-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_JANUS_WS_URL=wss://videocall.local/janus
      - VITE_TURN_SERVER=turn:videocall.local:3478
      - VITE_TURN_USERNAME=videouser
      - VITE_TURN_CREDENTIAL=videopass
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  default:
    name: videortc-network
    ipam:
      config:
        - subnet: 172.18.0.0/16
